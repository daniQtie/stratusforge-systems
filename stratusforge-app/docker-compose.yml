# StratusForge Systems — Nextcloud (web) + MariaDB (db), persistent volumes

services:
  db:
    image: mariadb:11
    container_name: stratusforge_db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-RootP@ss_2026}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-stratusforge}
      MARIADB_USER: ${MARIADB_USER:-stratus_admin}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-UserP@ss_2026}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks: [backend]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    image: nextcloud:29-apache
    container_name: stratusforge_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:80"
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MARIADB_DATABASE:-stratusforge}
      MYSQL_USER: ${MARIADB_USER:-stratus_admin}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD:-UserP@ss_2026}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-AdminP@ss_2026}
      NEXTCLOUD_TRUSTED_DOMAINS: "*"
    volumes:
      - nc_data:/var/www/html
    networks: [backend, frontend]

volumes:
  mariadb_data:
  nc_data:

networks:
  frontend:
  backend:
