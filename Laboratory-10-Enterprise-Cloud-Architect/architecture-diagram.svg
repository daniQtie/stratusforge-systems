<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .bg          { fill: #1a0b05; }
      .title       { font-size: 24px; font-weight: 800; fill: #fef3e8; letter-spacing: -0.5px; }
      .subtitle    { font-size: 13px; fill: #c9a890; }
      .lbl         { font-size: 13px; font-weight: 700; fill: #fef3e8; }
      .small       { font-size: 11px; fill: #c9a890; }
      .mono        { font-size: 11px; fill: #ffaa5a; font-family: "Consolas", monospace; letter-spacing: 1px; }
      .zone-host   { fill: rgba(60, 30, 15, 0.5); stroke: rgba(255, 170, 90, 0.3); stroke-width: 1.5; }
      .zone-vm     { fill: rgba(80, 40, 20, 0.4); stroke: rgba(255, 170, 90, 0.4); stroke-width: 1.5; }
      .zone-net    { fill: rgba(100, 55, 25, 0.3); stroke: rgba(255, 170, 90, 0.25); stroke-width: 1; stroke-dasharray: 4 3; }
      .fw-band     { fill: rgba(220, 70, 50, 0.15); stroke: #dc4632; stroke-width: 1.5; }
      .ctr-web     { fill: rgba(255, 107, 53, 0.1); stroke: #ff6b35; stroke-width: 1.8; }
      .ctr-db      { fill: rgba(130, 90, 200, 0.12); stroke: #9977dd; stroke-width: 1.8; }
      .vol         { fill: rgba(200, 160, 80, 0.12); stroke: #d4a853; stroke-width: 1.5; stroke-dasharray: 3 2; }
      .node-ext    { fill: rgba(60, 100, 160, 0.15); stroke: #5a95e0; stroke-width: 1.5; }
      .node-cron   { fill: rgba(100, 180, 100, 0.12); stroke: #6dd36d; stroke-width: 1.5; }
      .flow        { fill: none; stroke: #ffaa5a; stroke-width: 1.5; marker-end: url(#arr); }
      .flow-db     { fill: none; stroke: #9977dd; stroke-width: 1.5; marker-end: url(#arrdb); }
      .flow-store  { fill: none; stroke: #d4a853; stroke-width: 1.3; stroke-dasharray: 4 3; marker-end: url(#arrstore); }
      .legend-txt  { font-size: 10px; fill: #c9a890; font-family: "Consolas", monospace; }
      .num         { font-size: 10px; font-weight: 700; fill: #ffaa5a; font-family: "Consolas", monospace; }
      .stage       { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; fill: #ffaa5a; font-weight: 600; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ffaa5a"/>
    </marker>
    <marker id="arrdb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9977dd"/>
    </marker>
    <marker id="arrstore" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d4a853"/>
    </marker>
  </defs>

  <rect width="1200" height="780" class="bg"/>

  <!-- Header -->
  <text x="40" y="44" class="mono">STRATUSFORGE :: PRIVATE CLOUD ARCHITECTURE</text>
  <text x="40" y="74" class="title">Nextcloud + MariaDB on Ubuntu Server</text>
  <text x="40" y="94" class="subtitle">Multi-tier · persistent · firewall-hardened · cron-automated · documented</text>

  <!-- Numbered flow guide -->
  <g transform="translate(830, 50)">
    <text x="0" y="12" class="stage">Flow</text>
    <text x="0" y="30" class="legend-txt">1. Admin browser  →  2. UFW gate  →  3. Nextcloud container</text>
    <text x="0" y="46" class="legend-txt">4. Internal network  →  5. MariaDB container  →  6. Persistent volumes</text>
    <text x="0" y="62" class="legend-txt">7. Cron  →  mariadb-dump  +  rotate</text>
  </g>

  <!-- STAGE 1: EXTERNAL -->
  <text x="60" y="140" class="stage">External</text>
  <rect x="40" y="155" width="200" height="200" rx="4" class="zone-host"/>

  <rect x="60" y="180" width="160" height="70" rx="3" class="node-ext"/>
  <text x="140" y="203" text-anchor="middle" class="lbl">Admin Workstation</text>
  <text x="140" y="220" text-anchor="middle" class="small">Chrome / Firefox</text>
  <text x="140" y="238" text-anchor="middle" class="mono">:3000 HTTP</text>

  <rect x="60" y="265" width="160" height="70" rx="3" class="node-ext"/>
  <text x="140" y="288" text-anchor="middle" class="lbl">SSH Client</text>
  <text x="140" y="305" text-anchor="middle" class="small">OpenSSH / PuTTY</text>
  <text x="140" y="323" text-anchor="middle" class="mono">:22 TCP</text>

  <!-- STAGE 2: FIREWALL BAND -->
  <text x="290" y="140" class="stage">Perimeter</text>
  <rect x="270" y="155" width="90" height="500" rx="4" class="fw-band"/>
  <text x="315" y="200" text-anchor="middle" class="lbl" transform="rotate(-90, 315, 200)">UFW</text>
  <text x="315" y="400" text-anchor="middle" fill="#dc4632" font-size="11" font-family="Consolas, monospace" font-weight="700">default</text>
  <text x="315" y="416" text-anchor="middle" fill="#dc4632" font-size="11" font-family="Consolas, monospace" font-weight="700">DENY</text>
  <text x="315" y="470" text-anchor="middle" class="mono">allow 22</text>
  <text x="315" y="490" text-anchor="middle" class="mono">allow 3000</text>

  <!-- STAGE 3: UBUNTU VM -->
  <text x="430" y="140" class="stage">Ubuntu VM</text>
  <rect x="400" y="155" width="760" height="580" rx="6" class="zone-vm"/>
  <text x="420" y="185" class="lbl">Ubuntu Server 24.04 LTS · 192.168.56.10</text>
  <text x="420" y="203" class="small">Docker Engine · Compose v2 · systemd · cron · bash</text>

  <!-- Docker network region -->
  <rect x="420" y="220" width="720" height="380" rx="5" class="zone-net"/>
  <text x="440" y="246" class="mono">docker network: stratusforge_backend (bridge)</text>

  <!-- NEXTCLOUD CONTAINER -->
  <rect x="460" y="275" width="290" height="180" rx="5" class="ctr-web"/>
  <text x="605" y="302" text-anchor="middle" class="lbl">stratusforge_web</text>
  <text x="605" y="320" text-anchor="middle" class="mono">nextcloud:29-apache</text>
  <text x="605" y="345" text-anchor="middle" class="small">Host :3000  →  Container :80</text>
  <text x="605" y="365" text-anchor="middle" class="small">— file shares, calendars, contacts</text>
  <text x="605" y="385" text-anchor="middle" class="small">— sync clients, WebDAV</text>
  <text x="605" y="420" text-anchor="middle" class="mono">volume: nc_data</text>
  <text x="605" y="438" text-anchor="middle" class="small">/var/www/html</text>

  <!-- MARIADB CONTAINER -->
  <rect x="810" y="275" width="290" height="180" rx="5" class="ctr-db"/>
  <text x="955" y="302" text-anchor="middle" class="lbl">stratusforge_db</text>
  <text x="955" y="320" text-anchor="middle" class="mono">mariadb:11</text>
  <text x="955" y="345" text-anchor="middle" class="small">Internal :3306 only</text>
  <text x="955" y="365" text-anchor="middle" class="small">— not published to host</text>
  <text x="955" y="385" text-anchor="middle" class="small">— reachable via Docker DNS "db"</text>
  <text x="955" y="420" text-anchor="middle" class="mono">volume: mariadb_data</text>
  <text x="955" y="438" text-anchor="middle" class="small">/var/lib/mysql</text>

  <!-- Volumes -->
  <text x="430" y="630" class="stage">Persistent Storage</text>
  <rect x="460" y="645" width="290" height="70" rx="4" class="vol"/>
  <text x="605" y="670" text-anchor="middle" class="lbl">nc_data</text>
  <text x="605" y="690" text-anchor="middle" class="small">— user files &amp; config survive reboots</text>

  <rect x="810" y="645" width="290" height="70" rx="4" class="vol"/>
  <text x="955" y="670" text-anchor="middle" class="lbl">mariadb_data</text>
  <text x="955" y="690" text-anchor="middle" class="small">— relational data survives reboots</text>

  <!-- Cron / Backup -->
  <rect x="40" y="420" width="200" height="235" rx="4" class="node-cron"/>
  <text x="140" y="446" text-anchor="middle" class="lbl">Cron · Nightly Ops</text>
  <text x="140" y="466" text-anchor="middle" class="mono">0 2 * * *</text>
  <line x1="70" y1="478" x2="210" y2="478" stroke="#6dd36d" stroke-opacity="0.3" />
  <text x="140" y="500" text-anchor="middle" class="small">1. mariadb-dump → gz</text>
  <text x="140" y="520" text-anchor="middle" class="small">2. tar  nc_data</text>
  <text x="140" y="540" text-anchor="middle" class="small">3. health check :3000</text>
  <text x="140" y="560" text-anchor="middle" class="small">4. prune > 7 days</text>
  <text x="140" y="580" text-anchor="middle" class="small">5. append log</text>
  <text x="140" y="620" text-anchor="middle" class="mono">/var/backups/stratusforge</text>
  <text x="140" y="640" text-anchor="middle" class="mono">/var/log/stratusforge.log</text>

  <!-- Flow arrows -->
  <!-- browser → UFW → web container -->
  <path class="flow" d="M220,215 Q245,215 270,230"/>
  <path class="flow" d="M360,230 Q405,230 440,290 L458,290"/>

  <!-- SSH → UFW (just to show path) -->
  <path class="flow" d="M220,300 Q245,300 270,320"/>

  <!-- web → db -->
  <path class="flow-db" d="M750,365 L810,365"/>

  <!-- web → nc_data -->
  <path class="flow-store" d="M605,455 L605,645"/>
  <!-- db → mariadb_data -->
  <path class="flow-store" d="M955,455 L955,645"/>

  <!-- cron → VM -->
  <path class="flow" d="M240,500 Q320,500 400,420"/>

  <!-- Numbered circles for the flow -->
  <g>
    <circle cx="245" cy="215" r="9" fill="#1a0b05" stroke="#ffaa5a" stroke-width="1.3"/>
    <text x="245" y="219" text-anchor="middle" class="num">1</text>

    <circle cx="315" cy="245" r="9" fill="#1a0b05" stroke="#ffaa5a" stroke-width="1.3"/>
    <text x="315" y="249" text-anchor="middle" class="num">2</text>

    <circle cx="450" cy="265" r="9" fill="#1a0b05" stroke="#ffaa5a" stroke-width="1.3"/>
    <text x="450" y="269" text-anchor="middle" class="num">3</text>

    <circle cx="780" cy="358" r="9" fill="#1a0b05" stroke="#9977dd" stroke-width="1.3"/>
    <text x="780" y="362" text-anchor="middle" class="num" fill="#9977dd">5</text>

    <circle cx="605" cy="615" r="9" fill="#1a0b05" stroke="#d4a853" stroke-width="1.3"/>
    <text x="605" y="619" text-anchor="middle" class="num" fill="#d4a853">6</text>

    <circle cx="955" cy="615" r="9" fill="#1a0b05" stroke="#d4a853" stroke-width="1.3"/>
    <text x="955" y="619" text-anchor="middle" class="num" fill="#d4a853">6</text>

    <circle cx="320" cy="480" r="9" fill="#1a0b05" stroke="#6dd36d" stroke-width="1.3"/>
    <text x="320" y="484" text-anchor="middle" class="num" fill="#6dd36d">7</text>
  </g>

  <!-- Legend -->
  <rect x="40" y="690" width="200" height="60" rx="4" fill="rgba(60,30,15,0.5)" stroke="rgba(255,170,90,0.25)" stroke-width="1"/>
  <text x="60" y="712" class="mono" style="font-size:10px">LEGEND</text>
  <circle cx="68" cy="728" r="4" fill="#ff6b35"/>
  <text x="80" y="732" class="legend-txt">web tier (Nextcloud)</text>
  <circle cx="68" cy="743" r="4" fill="#9977dd"/>
  <text x="80" y="747" class="legend-txt">data tier (MariaDB)</text>
</svg>
